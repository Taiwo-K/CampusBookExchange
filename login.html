<!DOCTYPE html>

<html>

    <head>
        <title>Login Page</title>
    </head>

    <body>
        <h1>User Login</h1>
        <p>Please Use your UNT Email and your Password to sign in</p>
    
        <form action="/login" method="POST">

            <div style="text-align: center;">
                <label for="unt_email">UNT Email</label>
                <input type="text" id="unt_email" name="unt_email" required>
            </div>

            <br>
            <br>

            <div style="text-align:center;">
                <label for="password">Password</label>
                <input type="text" id="password" name="password" required>
            </div>

            <div style="text-align: center;">
                <button style="background-color: green; color: white;" type="submit">Login to account</button>
            </div>


        </form>
    
    </body>




</html>
