{% extends "base.html" %}
{% block title %}Create a Listing{% endblock %}

{% block content %}
        <h1>Listing Details</h1>
        <p>Please enter the textbook details</p>

        <form action="{{ url_for('listings.create_listing')}}" method="POST" enctype="multipart/form-data">
            
            <div style="text-align: center;">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" value="{{form.title if form else ''}}" required>
            </div>

            <br>

            <div style="text-align: center;">
                <label for="author">Author</label>
                <input type="text" id="author" name="author" value="{{form.author if form else ''}}" required>
            </div>

            <br>

            <div style="text-align: center;">
                <label for="edition">edition</label>
                <input type="text" id="edition" name="edition" value="{{form.edition if form else ''}}" required>
            </div>

            <br>

            <div style="text-align: center;">
                <label for="isbn">ISBN</label>
                <input type="number" id="isbn" name="isbn" value="{{form.isbn if form else ''}}" required>
            </div>

            <br>

            <div style="text-align: center;">
                <label for="retail_price">Retail Price</label>
                <input type="number" id="retail_price" name="retail_price" value="{{form.retail_price if form else ''}}" required>
            </div>

            <br>

            <div style="text-align: center;">
                <label for="price">Asking Price</label>
                <input type="number" id="price" name="price" value="{{form.price if form else ''}}" required>
            </div>

            <br>

            <div style="text-align:center;">
                <label for="condition">Condition</label>
                <input type="text" id="condition" name="condition" value="{{form.condition if form else ''}}" required>
            </div>

            <br>

            <div style="text-align: center;">
                <label for="listing_type">Type of Listing</label>
                <select id="listing_type" name="listing_type" required>
                    <option value="">Select a type</option>
                    <option value="sell" {{ 'selected' if form.listing_type == 'sale' else '' }}>Sell</option>
                    <option value="trade" {{ 'selected' if form.listing_type == 'trade' else '' }}>Trade</option>
                    <option value="giveaway" {{ 'selected' if form.listing_type == 'giveaway' else ''}}>Give Away</option>
                </select>
            </div>

            <br>

            <div style="text-align: center;">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4" cols="50" required></textarea>
            </div>

            <div style="text-align: center;">
                <label for="textbook_image">Please Upload up to a picture of your textbook</label>
                <input type="file" id="textbook_image" name="textbook_image" accept="image/*">
            </div>

            <br>

            <div style="text-align: center;">
            <img id="textbook_preview" src="" alt="TextBook Preview" style="max-width: 300px;">
            </div>

            <br>

            <div style="text-align: center;">
                <button style="background-color: green; color: white;" type="submit">Create Listing</button>
            </div>

        </form>

        {% endblock %}

        {% block scripts %}
        <script>
            const textbook_image = document.getElementById('textbook_image')
            const textbook_preview = document.getElementById('textbook_preview')

            textbook_image.addEventListener('change', function(event){
                const file = event.target.files[0];

                if (file){
                    const tempURL = URL.createObjectURL(file);

                    textbook_preview.src = tempURL;
                    textbook_preview.style.display = 'block';
                }
            });
        </script>
{% endblock %}
